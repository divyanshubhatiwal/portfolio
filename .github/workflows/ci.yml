name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # visual regression has its own workflow (visual.yml), with its own baselines
      - name: End-to-end tests
        run: npx playwright test --project=desktop --project=mobile

      # Lighthouse CI is fetched here instead of being a project dependency: its own dependency tree
      # has known-vulnerable packages, so it only ever exists on this throwaway CI machine.
      # the Vercel adapter writes the deployable static site to .vercel/output/static (see lighthouserc.json)
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 14
