name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      # Lighthouse CI is fetched here instead of being a project dependency: its own dependency tree
      # has known-vulnerable packages, so it only ever exists on this throwaway CI machine.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 14
