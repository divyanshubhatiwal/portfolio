name: Visual regression

# Compares screenshots of key pages (both themes) with the baselines in tests/__screenshots__/linux.
# To create or accept new baselines: Actions -> Visual regression -> Run workflow, with "update" ticked.
# That run commits the new screenshots to the branch it ran on.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: Accept the current screenshots as the new baselines and commit them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    if: ${{ !inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Compare with baselines
        run: |
          if [ ! -d tests/__screenshots__/linux ]; then
            echo "::notice::No baselines yet. Run this workflow by hand with 'update' ticked to create them."
            exit 0
          fi
          npx playwright test --project=visual
      - name: Keep the diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-diff
          path: playwright-report/
          retention-days: 14

  # write access only here, and only when started by hand with "update" ticked
  update:
    if: ${{ inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Update baselines
        run: |
          npx playwright test --project=visual --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__/linux
          git diff --cached --quiet || git commit -m "Update visual regression baselines"
          git push
